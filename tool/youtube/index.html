<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FASTSONG - YouTube to MP3 & MP4 Converter</title>

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="https://fastsong.eu.org/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="https://fastsong.eu.org/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://fastsong.eu.org/apple-touch-icon.png">

<!-- Google Adsense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4633437485737999" crossorigin="anonymous"></script>
<meta name="google-adsense-account" content="ca-pub-4633437485737999">

<!-- PWA -->
<link rel="manifest" href="manifest.json">

<!-- CSS -->
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ui.css">

<!-- Video.js CSS -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.23.4/video-js.min.css" rel="stylesheet" crossorigin="anonymous" referrerpolicy="no-referrer" />

<style>
body{background:#121212; color:#fff; font-family:Arial,sans-serif; margin:0; padding:0;}
header{background:#000; padding:15px; text-align:center; font-size:28px; font-weight:bold; letter-spacing:2px;}
.container{max-width:800px; margin:auto; padding:20px;}
input,select,button{width:100%; padding:12px; margin:8px 0; border-radius:8px; border:none; font-size:16px;}
input,select{background:#1f1f1f; color:#fff;}
button{background:#ff4747; color:#fff; cursor:pointer; transition:0.3s;}
button:hover{background:#e33c3c;}
.video-container{margin-top:20px;}
.playlist-item{margin-top:15px; background:#1f1f1f; padding:10px; border-radius:8px;}
.playlist-item h3{margin:0 0 5px 0; font-size:18px;}
.share-buttons{margin-top:10px;}
.share-buttons button{width:auto; margin:5px; padding:8px 12px; border-radius:6px;}
.wa{background:#1bd741;}
.fb{background:#1877f2;}
.tg{background:#0088cc;}
.tw{background:#1da1f2;}
.copy-btn{background:#555;}
</style>
</head>
<body>

<header>FASTSONG</header>

<div class="container">
    <input type="text" id="song-title" placeholder="Masukkan Judul Lagu...">
    <input type="text" id="yt-url" placeholder="Masukkan URL YouTube...">
    <select id="format">
        <option value="mp4">MP4 (Video)</option>
        <option value="mp3">MP3 (Audio)</option>
    </select>
    <button onclick="addVideo()">Tambahkan ke Playlist</button>

    <div class="video-container">
        <video id="player" class="video-js vjs-default-skin" controls preload="auto" width="720" height="400"></video>
    </div>

    <div id="playlist-container"></div>
</div>

<!-- JS Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.23.4/video.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-youtube/3.0.1/Youtube.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-playlists/0.2.0/videojs-playlists.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aurora.js-mp3/0.1.0/mp3.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
let player = videojs('player');
let playlist = [];

function getYouTubeID(url){
    const reg = /(?:youtube\.com\/(?:watch\?.*v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
    const match = url.match(reg);
    return match ? match[1] : null;
}

function addVideo(){
    const url = document.getElementById('yt-url').value.trim();
    const title = document.getElementById('song-title').value.trim() || "Judul Tidak Diketahui";
    const format = document.getElementById('format').value;
    const videoID = getYouTubeID(url);

    if(!videoID && format==='mp4'){ alert("URL YouTube tidak valid!"); return; }

    let source;
    if(format==='mp4'){
        source = { src: `https://www.youtube.com/watch?v=${videoID}`, type: 'video/youtube', title: title };
    } else {
        // MP3 sample legal
        source = { src: 'https://sample.cat/en/mp3/file_example_MP3_700KB.mp3', type: 'audio/mp3', title: title };
    }

    playlist.push(source);
    player.playlist(playlist);
    player.playlist.currentItem(playlist.length-1);

    renderPlaylist();
}

function renderPlaylist(){
    const container = document.getElementById('playlist-container');
    container.innerHTML = '';
    playlist.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'playlist-item';
        div.innerHTML = `
            <h3>${item.title}</h3>
            <div class="share-buttons">
                <button class="copy-btn" onclick="copyLink('${index}')">Copy Link</button>
                <button class="wa" onclick="shareWA('${index}')">WhatsApp</button>
                <button class="fb" onclick="shareFB('${index}')">Facebook</button>
                <button class="tg" onclick="shareTG('${index}')">Telegram</button>
                <button class="tw" onclick="shareTW('${index}')">Twitter</button>
            </div>
        `;
        div.addEventListener('click', () => { player.playlist.currentItem(index); });
        container.appendChild(div);
    });
}

// Share functions
function copyLink(index){ navigator.clipboard.writeText(playlist[index].src); alert('Link disalin!'); }
function shareWA(index){ window.open(`https://wa.me/?text=${encodeURIComponent(playlist[index].src)}`); }
function shareFB(index){ window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(playlist[index].src)}`); }
function shareTG(index){ window.open(`https://t.me/share/url?url=${encodeURIComponent(playlist[index].src)}`); }
function shareTW(index){ window.open(`https://twitter.com/intent/tweet?url=${encodeURIComponent(playlist[index].src)}`); }
</script>

</body>
</html>
