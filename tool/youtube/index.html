<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FASTSONG - YouTube to MP3 & MP4 Converter</title>

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="https://fastsong.eu.org/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="https://fastsong.eu.org/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://fastsong.eu.org/apple-touch-icon.png">

<!-- Google Adsense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4633437485737999" crossorigin="anonymous"></script>

<!-- Video.js CSS -->

<style>
body{background:#121212; color:#fff; font-family:Arial,sans-serif; margin:0; padding:0;}
header{background:#000; padding:15px; text-align:center; font-size:28px; font-weight:bold; letter-spacing:2px;}
.container{max-width:800px; margin:auto; padding:20px;}
input,select,button{width:100%; padding:12px; margin:8px 0; border-radius:8px; border:none; font-size:16px;}
input,select{background:#1f1f1f; color:#fff;}
button{background:#ff4747; color:#fff; cursor:pointer; transition:0.3s;}
button:hover{background:#e33c3c;}
.video-container{margin-top:20px;}
.share-buttons{margin-top:15px;}
.share-buttons button{width:auto; margin:5px; padding:10px 15px; border-radius:6px;}
.wa{background:#1bd741;}
.fb{background:#1877f2;}
.tg{background:#0088cc;}
.tw{background:#1da1f2;}
.copy-btn{background:#555;}
</style>
</head>
<body>

<header>FASTSONG</header>

<div class="container">
    <input type="text" id="yt-url" placeholder="Masukkan URL YouTube...">
    <select id="format">
        <option value="mp4">MP4 (Video)</option>
        <option value="mp3">MP3 (Audio)</option>
    </select>
    <button onclick="addVideo()">Tampilkan Video/Audio</button>

    <div class="video-container">
        <video id="player" class="video-js vjs-default-skin" controls preload="auto" width="720" height="400"></video>
    </div>

    <div class="share-buttons">
        <button class="copy-btn" onclick="copyLink()">Copy Link</button>
        <button class="wa" onclick="shareWA()">WhatsApp</button>
        <button class="fb" onclick="shareFB()">Facebook</button>
        <button class="tg" onclick="shareTG()">Telegram</button>
        <button class="tw" onclick="shareTW()">Twitter</button>
    </div>
</div>

<!-- JS Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.23.4/video.min.js" integrity="sha512-frQAbRblLAB27W72seJtP+PijHuCtSfQ+k+LS7M4v27gjKb5doigt4khTLCwILnWz8sd+MPu3Qzkaduq4dwitA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-youtube/3.0.1/Youtube.js" integrity="sha512-U0OTmn6sp7s4GEL5vB45aX15fnXLydyDeaqAERRbf8DnVgo+ZwhUm674/ozek44R+nvuHgM2779EH2TXyUgrzQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-playlists/0.2.0/videojs-playlists.min.js" integrity="sha512-UB+FLwO4PR/gLVdGOV3RmJj1CD4uXt7fPTNJ5mP7CRR+coZtfJrHtJxZER/0BpPsZPWkRM/+9F8WNDNUqACV6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/downloadjs/1.4.8/download.min.js" integrity="sha512-WiGQZv8WpmQVRUFXZywo7pHIO0G/o3RyiAJZj8YXNN4AV7ReR1RYWVmZJ6y3H06blPcjJmG/sBpOVZjTSFFlzQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aurora.js-mp3/0.1.0/mp3.min.js" integrity="sha512-pzWFe7OanIWEqw6rV6K1gkFa6Qkjkve797/7HdxsEZHAdV/OKatQ2YB2hHMaXNNJUizL1HBMjPV6wPt5RpXlMg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
let player = videojs('player');
let playlist = [];

function getYouTubeID(url){
    const reg = /(?:youtube\.com\/(?:watch\?.*v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
    const match = url.match(reg);
    return match ? match[1] : null;
}

function addVideo(){
    const url = document.getElementById('yt-url').value.trim();
    const format = document.getElementById('format').value;
    const videoID = getYouTubeID(url);

    if(!videoID){ alert("URL tidak valid!"); return; }

    let source;
    if(format==='mp4'){
        source = { src: `https://www.youtube.com/watch?v=${videoID}`, type: 'video/youtube' };
    } else { 
        source = { src: 'https://sample.cat/en/mp3/file_example_MP3_700KB.mp3', type: 'audio/mp3' };
    }

    playlist.push(source);
    player.playlist(playlist);
    player.playlist.currentItem(playlist.length-1);
}

// Tombol Share
function copyLink(){ navigator.clipboard.writeText(document.getElementById('yt-url').value); alert('Link disalin!'); }
function shareWA(){ window.open(`https://wa.me/?text=${encodeURIComponent(document.getElementById('yt-url').value)}`); }
function shareFB(){ window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(document.getElementById('yt-url').value)}`); }
function shareTG(){ window.open(`https://t.me/share/url?url=${encodeURIComponent(document.getElementById('yt-url').value)}`); }
function shareTW(){ window.open(`https://twitter.com/intent/tweet?url=${encodeURIComponent(document.getElementById('yt-url').value)}`); }
</script>

</body>
</html>
