<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Drum Kit Advanced</title>
    <link rel="stylesheet" href="style.css">
<style type="text/css">
#visualizer {
    display: block;
    margin: 30px auto;
    width: 90%;
    max-width: 900px;
    height: 250px;
    background: #111;
    border: 1px solid #555;
    border-radius: 10px;
}

</style>
<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="https://fastsong.eu.org/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="https://fastsong.eu.org/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://fastsong.eu.org/apple-touch-icon.png">
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ui.css">
<link rel="manifest" href="manifest.json">

<!-- GOOGLE ADSENSE -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4633437485737999"
crossorigin="anonymous"></script>
<meta name="google-adsense-account" content="ca-pub-4633437485737999">

<script async custom-element="amp-auto-ads"
        src="https://cdn.ampproject.org/v0/amp-auto-ads-0.1.js">
</script>

</head>
<body>

<h1>Virtual Drum Kit – Advanced</h1>

<div class="controls">
    <button id="recordBtn">🔴 Record</button>
    <button id="playBtn">▶️ Play</button>
    <label>
        Volume:
        <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="1">
    </label>
</div>
<div class="drum-container">
    <button class="drum" data-sound="kick.wav">Kick</button>
    <button class="drum" data-sound="snare.wav">Snare</button>
    <button class="drum" data-sound="hihat.wav">Hi-Hat</button>
    <button class="drum" data-sound="tom1.wav">Tom 1</button>
    <button class="drum" data-sound="tom2.wav">Tom 2</button>
    <button class="drum" data-sound="crash.wav">Crash</button>
</div>

<div class="loop-container">
    <button class="loop" data-sound="90_Back_Loop_BBD_FatLoops_01.wav">Loop 1</button>
    <button class="loop" data-sound="90_Back_Loop_BBD_FatLoops_02.wav">Loop 2</button>
</div>

<div class="fx-container">
    <button class="fx" data-sound="mixkit-arcade-chiptune-explosion-1691.wav">Chiptune Explosion</button>
</div>

<canvas id="visualizer" width="900" height="250"></canvas>

<script src="audio-effects.js"></script>
<script src="app.js"></script>
<script src="visualizer.js"></script>

<script type="text/javascript">
const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

// Analyser global
const analyser = audioCtx.createAnalyser();
analyser.fftSize = 512;
const bufferLength = analyser.frequencyBinCount;
const dataArray = new Uint8Array(bufferLength);

// Mapping drum ke warna
const drumColors = {
    kick: "#ff3b3b",
    snare: "#3bafff",
    hihat: "#fffa3b",
    tom1: "#ff8c3b",
    tom2: "#8cff3b",
    crash: "#ff3bfa"
};

// Track untuk setiap drum
const drumTracks = {
    kick: new Uint8Array(bufferLength),
    snare: new Uint8Array(bufferLength),
    hihat: new Uint8Array(bufferLength),
    tom1: new Uint8Array(bufferLength),
    tom2: new Uint8Array(bufferLength),
    crash: new Uint8Array(bufferLength)
};

// Override playSound supaya input ke track spesifik
function playSoundWithTrack(name) {
    const source = audioCtx.createBufferSource();
    source.buffer = drumBuffers[name];
    const trackGain = audioCtx.createGain();
    source.connect(trackGain).connect(analyser);
    source.start(0);
}

// Animate visualizer
function drawVisualizer() {
    requestAnimationFrame(drawVisualizer);

    analyser.getByteFrequencyData(dataArray);

    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#111";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const barWidth = (canvas.width / bufferLength) * 2.5;
    let x = 0;

    // Multi-track: setiap drum memiliki bar dengan warna berbeda
    Object.keys(drumTracks).forEach(drum => {
        // Simulasi track: gunakan sebagian dataArray
        for (let i = 0; i < bufferLength; i++) {
            const value = dataArray[i] * Math.random(); // variasi untuk visual track
            ctx.fillStyle = drumColors[drum];
            ctx.globalAlpha = 0.3; // transparansi agar overlay warna terlihat
            ctx.fillRect(x, canvas.height - value / 2, barWidth, value / 2);
            x += barWidth;
        }
        x = 0; // reset x untuk drum selanjutnya
    });

    ctx.globalAlpha = 1; // reset alpha
}

// Start visualizer
drawVisualizer();

</script>
</body>
</html>
