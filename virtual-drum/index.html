<style type="text/css">
#visualizer {
    display: block;
    margin: 30px auto;
    width: 90%;
    max-width: 900px;
    height: 250px;
    background: #111;
    border: 1px solid #555;
    border-radius: 10px;
}
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #222;
    color: #fff;
}

h1 {
    margin-top: 40px;
}

.drum-container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 40px;
}

.drum {
    width: 120px;
    height: 120px;
    margin: 15px;
    border-radius: 10px;
    border: none;
    background: #444;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    transition: 0.1s;
}

.drum:active,
.drum.playing {
    background: #ff9800;
    transform: scale(1.05);
}
.loop {
    width: 120px;
    height: 120px;
    margin: 15px;
    border-radius: 10px;
    border: none;
    background: #444;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    transition: 0.1s;
}
.fx {
    width: 120px;
    height: 120px;
    margin: 15px;
    border-radius: 10px;
    border: none;
    background: #444;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    transition: 0.1s;

<body>

<script src="audio-effects.js"></script>
<script src="app.js">
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const masterGain = audioCtx.createGain();
masterGain.connect(audioCtx.destination);

let buffers = {}; // Semua suara di satu object

// Load audio
async function loadAudio(path) {
    const res = await fetch(path);
    const arrayBuffer = await res.arrayBuffer();
    return await audioCtx.decodeAudioData(arrayBuffer);
}

// Semua nama file di sounds/
const soundFiles = [
    "kick.wav","snare.wav","hihat.wav","tom1.wav","tom2.wav","crash.wav",
    "90_Back_Loop_BBD_FatLoops_01.wav","90_Back_Loop_BBD_FatLoops_02.wav","90_Back_Loop_BBD_FatLoops_03.wav",
    "BD_BBD_FatLoops_01.wav","BD_BBD_FatLoops_02.wav","BD_BBD_FatLoops_03.wav",
    "CC_BBD_FatLoops_01.wav","CP_BBD_FatLoops_01.wav","CY_BBD_FatLoops_01.wav",
    "FX_BBD_FatLoops_01.wav","FX_BBD_FatLoops_02.wav",
    "HH_BBD_FatLoops_01.wav","HH_BBD_FatLoops_02.wav","HH_BBD_FatLoops_03.wav",
    "PC_BBD_FatLoops_01.wav",
    "SD_BBD_FatLoops_01.wav","SD_BBD_FatLoops_02.wav","SD_BBD_FatLoops_03.wav",
    "Yahoo - Chime.mp3","Yahoo - Classic.mp3","Yahoo - Completion.m4a",
    "Yahoo - Easy.m4a","Yahoo - Got Mail.mp3","Yahoo - Mallet.m4a",
    "Yahoo - Melody.m4a","Yahoo - Precision.m4a","Yahoo - Reflective.m4a",
    "Yahoo - Sequence.m4a","Yahoo - Skipping Rocks.m4a","Yahoo - Snip Snap.m4a",
    "Yahoo - Soft Reminder.m4a",
    "mixkit-arcade-chiptune-explosion-1691.wav",
    "mixkit-bomb-drop-cold-water-explosion-2806.wav",
    "mixkit-collapsing-structure-2958.wav",
    "mixkit-dramatic-metal-explosion-impact-1687.wav",
    "mixkit-joke-drums-578.wav"
];

// Load semua file
async function loadAllSounds() {
    for (let file of soundFiles) {
        buffers[file] = await loadAudio(`sounds/${file}`);
    }
}

// Main play function
function playSound(name) {
    const buffer = buffers[name];
    if (!buffer) return;
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.connect(masterGain);
    source.start();
}

// Event tombol drum/loop/fx
document.querySelectorAll(".drum, .loop, .fx").forEach(btn => {
    btn.addEventListener("click", () => {
        playSound(btn.dataset.sound);
    });
});

window.addEventListener("load", loadAllSounds);

</script>
<script type="text/javascript">
const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

// Analyser global
const analyser = audioCtx.createAnalyser();
analyser.fftSize = 512;
const bufferLength = analyser.frequencyBinCount;
const dataArray = new Uint8Array(bufferLength);

// Mapping drum ke warna
const drumColors = {
    kick: "#ff3b3b",
    snare: "#3bafff",
    hihat: "#fffa3b",
    tom1: "#ff8c3b",
    tom2: "#8cff3b",
    crash: "#ff3bfa"
};

// Track untuk setiap drum
const drumTracks = {
    kick: new Uint8Array(bufferLength),
    snare: new Uint8Array(bufferLength),
    hihat: new Uint8Array(bufferLength),
    tom1: new Uint8Array(bufferLength),
    tom2: new Uint8Array(bufferLength),
    crash: new Uint8Array(bufferLength)
};

// Override playSound supaya input ke track spesifik
function playSoundWithTrack(name) {
    const source = audioCtx.createBufferSource();
    source.buffer = drumBuffers[name];
    const trackGain = audioCtx.createGain();
    source.connect(trackGain).connect(analyser);
    source.start(0);
}

// Animate visualizer
function drawVisualizer() {
    requestAnimationFrame(drawVisualizer);

    analyser.getByteFrequencyData(dataArray);

    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#111";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const barWidth = (canvas.width / bufferLength) * 2.5;
    let x = 0;

    // Multi-track: setiap drum memiliki bar dengan warna berbeda
    Object.keys(drumTracks).forEach(drum => {
        // Simulasi track: gunakan sebagian dataArray
        for (let i = 0; i < bufferLength; i++) {
            const value = dataArray[i] * Math.random(); // variasi untuk visual track
            ctx.fillStyle = drumColors[drum];
            ctx.globalAlpha = 0.3; // transparansi agar overlay warna terlihat
            ctx.fillRect(x, canvas.height - value / 2, barWidth, value / 2);
            x += barWidth;
        }
        x = 0; // reset x untuk drum selanjutnya
    });

    ctx.globalAlpha = 1; // reset alpha
}

// Start visualizer
drawVisualizer();

</script>
</body>
</html>
